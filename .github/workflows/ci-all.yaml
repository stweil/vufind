# GitHub action - Run extended CI test for VuFind

name: CI (all)

on:
  push:  # Add this temporarily
    branches:
      - dev
  # Trigger workflow in GitHub web frontend or from API.
  workflow_dispatch:
    inputs:
      php-version:
        description: 'PHP version'
        required: true
        default: '8.4'
        type: choice
        options:
          - '8.2'
          - '8.3'
          - '8.4'
          - 'all'

jobs:
  run-tests:
    name: Tests with PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    env:
      VUFIND_HOME: ${{ github.workspace }}
      VUFIND_LOCAL_DIR: ${{ github.workspace }}/local
    strategy:
      matrix:
        php-version: ['8.3']
        #php-version: ${{
        #  (github.event_name == 'push') && fromJSON('["8.4"]') ||
        #  (inputs.php-version == 'all') && fromJSON('["8.2", "8.3", "8.4"]') ||
        #  fromJSON(format('["{0}"]', inputs.php-version))
        #}}

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: intl, xsl
          tools: composer:2.8.1
          ini-values: error_reporting=E_ALL

      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract Solr version from build.xml
        id: solr-version
        run: |
          SOLR_VERSION=$(grep -oP 'property name="solr_version" value="\K[^"]+' build.xml)
          echo "version=$SOLR_VERSION" >> $GITHUB_OUTPUT
          pwd
          ls -la
          export

      - name: Restore Solr download cache
        id: cache-solr
        uses: actions/cache/restore@v5
        with:
          path: downloads/solr-${{ steps.solr-version.outputs.version }}.tgz
          key: solr-${{ steps.solr-version.outputs.version }}
          restore-keys: solr-

      - name: Download Solr (unless in cache)
        if: steps.cache-solr.outputs.cache-hit != 'true'
        run: |
          mkdir -pv downloads
          curl -L -o downloads/solr-${{ steps.solr-version.outputs.version }}.tgz \
            https://archive.apache.org/dist/solr/solr/${{ steps.solr-version.outputs.version }}/solr-${{ steps.solr-version.outputs.version }}.tgz

      - name: Save Solr download cache
        if: always() && steps.cache-solr.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: downloads/solr-${{ steps.solr-version.outputs.version }}.tgz
          key: solr-${{ steps.solr-version.outputs.version }}

      - name: Install Debian packages
        if: ${{ matrix.phing_tasks == 'never' }}
        run: |
          echo "USER='$USER'"
          sudo apt-get update
          sudo apt-get install -y mariadb-server apache2

      - name: Configure Apache for PHP ${{ matrix.php-version }}
        run: |
          # Enable required Apache modules
          sudo a2enmod rewrite proxy_fcgi setenvif

          # Configure Apache to use the PHP-FPM from setup-php action
          sudo a2enconf php${{ matrix.php-version }}-fpm

          # Start PHP-FPM service (installed by setup-php action)
          sudo systemctl start php${{ matrix.php-version }}-fpm

          # Restart Apache to apply changes
          sudo systemctl restart apache2

      - name: Setup node
        if: ${{ matrix.phing_tasks == 'qa-console' }}
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Cache NPM dependencies
        if: ${{ matrix.phing_tasks == 'qa-console' }}
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('**/package.json') }}
          restore-keys: npm-

      - name: Install node dependencies
        if: ${{ matrix.phing_tasks == 'qa-console' }}
        # Use --ignore-scripts to prevent pre/post install scripts from running
        # (a security precaution).
        run: npm install --ignore-scripts

      - name: Rebuild node-sass dependency
        if: ${{ matrix.phing_tasks == 'qa-console' }}
        # The --ignore-scripts parameter to npm install prevents node-sass from
        # fully building. We need to force it to build so the SCSS check in the
        # qa-console task runs successfully.
        run: npm rebuild node-sass

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Cache php-cs-fixer data
        uses: actions/cache@v5
        with:
          path: .php_cs_cache
          key: "php-${{ matrix.php-version }}-php-cs-fixer-${{ github.sha }}"
          restore-keys: "php-${{ matrix.php-version }}-php-cs-fixer-"

      - name: Cache phpstan data
        uses: actions/cache@v5
        with:
          path: .phpstan_cache
          key: "php-${{ matrix.php-version }}-phpstan-${{ github.sha }}"
          restore-keys: "php-${{ matrix.php-version }}-phpstan-"

      - name: Cache PHP_CodeSniffer data
        uses: actions/cache@v5
        with:
          path: tests/phpcs.cache.json
          key: "php-${{ matrix.php-version }}-phpcs-${{ github.sha }}"
          restore-keys: "php-${{ matrix.php-version }}-phpcs-"

      - name: Cache rector data
        uses: actions/cache@v5
        with:
          path: .rector
          key: "php-${{ matrix.php-version }}-rector-${{ github.sha }}"
          restore-keys: "php-${{ matrix.php-version }}-rector-"

      - name: Install composer dependencies
        run: composer install

      - name: Create admin user for MariaDB
        run: |
          #sudo mariadb --execute="CREATE USER admin@localhost IDENTIFIED BY 'vufind';"
          #sudo mariadb --execute="GRANT ALL ON *.* TO admin@localhost WITH GRANT OPTION;"
          sudo systemctl start mysql.service

      - name: Start Chrome
        run: |
          nohup $CHROME_BIN \
            --headless=new \
            --no-sandbox \
            --disable-client-side-phishing-detection \
            --disable-component-update \
            --disable-dev-shm-usage \
            --disable-domain-reliability \
            --disable-gpu \
            --disable-software-rasterizer \
            --disable-extensions \
            --disable-background-networking \
            --disable-sync \
            --disable-translate \
            --metrics-recording-only \
            --disable-default-apps \
            --mute-audio \
            --no-first-run \
            --no-pings \
            --password-store=basic \
            --remote-debugging-address=127.0.0.1 \
            --remote-debugging-port=9222 \
            --use-mock-keychain \
            --window-size=1600,1200 \
            --disable-extensions --user-data-dir=$PWD/chromium-test-user-dir > chrome.log &
          sleep 10
          tail -f chrome.log &

      - name: Debug GitHub action
        run: |
          ps axf
          pwd
          ls -la
          export

      - name: Run phing startup
        run: |
          vendor/bin/phing -Dmysqlrootuser=root -Dmysqlrootpass=root -Dmink_driver="chrome" -Dextra_shutdown_cleanup="sudo chown -R $USER: $VUFIND_LOCAL_DIR/cache" -Dapacheconfdir=/etc/apache2/conf-enabled -Dapachectl=/usr/sbin/apachectl -Dvufindurl=http://localhost/vufind_test startup

      - name: Run curl
        run: |
          curl http://localhost/vufind_test/MyResearch/Profile

      - name: Run tests
        run: |
          vendor/bin/phing -Dmysqlrootuser=root -Dmysqlrootpass=root -Dmink_driver="chrome" -Dextra_shutdown_cleanup="sudo chown -R $USER: $VUFIND_LOCAL_DIR/cache" -Dapacheconfdir=/etc/apache2/conf-enabled -Dapachectl=/usr/sbin/apachectl -Dvufindurl=http://localhost/vufind_test phpunit
          # vendor/bin/phing -Dmysqlrootuser=admin -Dmysqlrootpass=vufind -Dmink_driver="chrome" -Dextra_shutdown_cleanup="sudo chown -R $USER: $VUFIND_LOCAL_DIR/cache" -Dapacheconfdir=/etc/apache2/conf-enabled -Dapachectl=/usr/sbin/apachectl -Dvufindurl=http://localhost/vufind_test main
