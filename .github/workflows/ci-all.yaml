# GitHub action - Run extended CI test for VuFind

name: CI (all)

on:
  push:  # Add this temporarily
    branches:
      - dev
  # Trigger workflow in GitHub web frontend or from API.
  workflow_dispatch:
    inputs:
      php-version:
        description: 'PHP version'
        required: true
        default: '8.4'
        type: choice
        options:
          - '8.2'
          - '8.3'
          - '8.4'
          - 'all'

jobs:
  run-tests:
    name: Tests with PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest

    services:
      selenium:
        image: selenium/standalone-chrome:latest
        ports:
          - 4444:4444
        options: >-
          --shm-size=2g

    env:
      VUFIND_HOME: ${{ github.workspace }}
      VUFIND_LOCAL_DIR: ${{ github.workspace }}/local
    strategy:
      matrix:
        php-version: ['8.3']
        #php-version: ${{
        #  (github.event_name == 'push') && fromJSON('["8.4"]') ||
        #  (inputs.php-version == 'all') && fromJSON('["8.2", "8.3", "8.4"]') ||
        #  fromJSON(format('["{0}"]', inputs.php-version))
        #}}

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: intl, xsl
          tools: composer:2.8.1
          ini-values: error_reporting=E_ALL

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Debian packages
        run: |
          echo "USER='$USER'"
          sudo apt-get update
          sudo apt-get install -y mariadb-server apache2

      - name: Configure Apache for PHP ${{ matrix.php-version }}
        run: |
          # Enable required Apache modules
          sudo a2enmod rewrite proxy_fcgi setenvif

          # Configure Apache to use the PHP-FPM from setup-php action
          sudo a2enconf php${{ matrix.php-version }}-fpm

          # Start PHP-FPM service (installed by setup-php action)
          sudo systemctl start php${{ matrix.php-version }}-fpm

          # Restart Apache to apply changes
          sudo systemctl restart apache2

      - name: Setup node
        if: ${{ matrix.phing_tasks == 'qa-console' }}
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Cache NPM dependencies
        if: ${{ matrix.phing_tasks == 'qa-console' }}
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('**/package.json') }}
          restore-keys: npm-

      - name: Install node dependencies
        if: ${{ matrix.phing_tasks == 'qa-console' }}
        # Use --ignore-scripts to prevent pre/post install scripts from running
        # (a security precaution).
        run: npm install --ignore-scripts

      - name: Rebuild node-sass dependency
        if: ${{ matrix.phing_tasks == 'qa-console' }}
        # The --ignore-scripts parameter to npm install prevents node-sass from
        # fully building. We need to force it to build so the SCSS check in the
        # qa-console task runs successfully.
        run: npm rebuild node-sass

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Cache php-cs-fixer data
        uses: actions/cache@v5
        with:
          path: .php_cs_cache
          key: "php-${{ matrix.php-version }}-php-cs-fixer-${{ github.sha }}"
          restore-keys: "php-${{ matrix.php-version }}-php-cs-fixer-"

      - name: Cache phpstan data
        uses: actions/cache@v5
        with:
          path: .phpstan_cache
          key: "php-${{ matrix.php-version }}-phpstan-${{ github.sha }}"
          restore-keys: "php-${{ matrix.php-version }}-phpstan-"

      - name: Cache PHP_CodeSniffer data
        uses: actions/cache@v5
        with:
          path: tests/phpcs.cache.json
          key: "php-${{ matrix.php-version }}-phpcs-${{ github.sha }}"
          restore-keys: "php-${{ matrix.php-version }}-phpcs-"

      - name: Cache rector data
        uses: actions/cache@v5
        with:
          path: .rector
          key: "php-${{ matrix.php-version }}-rector-${{ github.sha }}"
          restore-keys: "php-${{ matrix.php-version }}-rector-"

      - name: Restore cached Solr download
        uses: actions/cache/restore@v5
        with:
          key: "solr-${{ hashFiles('downloads/solr-*.tgz') }}"
          path: downloads/solr-*.tgz
          restore-keys: "solr-"

      - name: Install composer dependencies
        run: composer install

      - name: Save cached Solr download
        uses: actions/cache/save@v5
        with:
          key: "solr-${{ hashFiles('downloads/solr-*.tgz') }}"
          path: downloads/solr-*.tgz

      - name: Disable Solr installation
        run: touch solr/.disableAutomaticInstall

      - name: Create admin user for MariaDB
        run: |
          sudo mariadb --execute="CREATE USER admin@localhost IDENTIFIED BY 'vufind';"
          sudo mariadb --execute="GRANT ALL ON *.* TO admin@localhost WITH GRANT OPTION;"

      - name: Run tests
        run: |
          pwd
          ls -la
          export
          vendor/bin/phing -Dmysqlrootuser=admin -Dmysqlrootpass=vufind -Dapachectl=/usr/sbin/apachectl main
